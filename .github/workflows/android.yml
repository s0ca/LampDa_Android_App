name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android-app
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Run unit tests, lint and compile APK
        run: >-
          bash ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          -Pandroid.injected.testOnly=false

      - name: Prepare downloadable APK and checksum
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(jq -er '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]
          mkdir -p ../dist
          filename="LampDa-${version}-${COMMIT_SHA:0:7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/$filename"
          cd ../dist
          sha256sum "$filename" > SHA256SUMS.txt
          {
            printf '### APK ready\n\n'
            printf 'Download **LampDa-debug-%s** from this run\047s Artifacts section.\n\n' "$COMMIT_SHA"
            printf 'Debug build only: the temporary CI signing key can differ between runs and from locally installed APKs.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LampDa-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-reports-${{ github.sha }}
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.*
            android-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
